<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BA8C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A7C9B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- iOS-Rounded-Rectangle -->
  <rect width="512" height="512" rx="115" fill="url(#skyGradient)"/>

  <!-- Schnee-Boden -->
  <ellipse cx="256" cy="460" rx="240" ry="60" fill="#ffffff" opacity="0.9"/>

  <!-- Baum links hinten -->
  <rect x="80" y="180" width="15" height="280" fill="#1a0f0a"/>
  <polygon points="87.5,120 60,180 115,180" fill="#1a0f0a"/>

  <!-- Baum rechts hinten -->
  <rect x="420" y="200" width="15" height="260" fill="#1a0f0a"/>
  <polygon points="427.5,140 400,200 455,200" fill="#1a0f0a"/>

  <!-- Baum links vorne -->
  <rect x="140" y="220" width="18" height="240" fill="#0f0a08"/>
  <polygon points="149,160 120,220 178,220" fill="#0f0a08"/>

  <!-- Hütte -->
  <g>
    <!-- Wand -->
    <rect x="200" y="300" width="112" height="100" fill="#3d2f1f"/>

    <!-- Dach -->
    <polygon points="256,240 180,300 332,300" fill="#2d1f0f"/>

    <!-- Fenster links (beleuchtet) -->
    <rect x="215" y="320" width="25" height="30" fill="#f5c842" opacity="0.9"/>

    <!-- Fenster rechts (beleuchtet) -->
    <rect x="272" y="320" width="25" height="30" fill="#f5c842" opacity="0.9"/>

    <!-- Tür -->
    <rect x="240" y="350" width="32" height="50" fill="#2d1f0f"/>

    <!-- Türgriff -->
    <circle cx="265" cy="375" r="2" fill="#f5c842"/>
  </g>

  <!-- Reh (klein, rechts von Hütte) -->
  <g transform="translate(350, 390) scale(0.6)">
    <!-- Körper -->
    <ellipse cx="0" cy="0" rx="22" ry="16" fill="#d4a574"/>
    <!-- Kopf -->
    <circle cx="0" cy="-20" r="11" fill="#d4a574"/>
    <!-- Geweih -->
    <line x1="-5" y1="-28" x2="-10" y2="-36" stroke="#d4a574" stroke-width="2.5"/>
    <line x1="5" y1="-28" x2="10" y2="-36" stroke="#d4a574" stroke-width="2.5"/>
    <!-- Beine (angedeutet) -->
    <line x1="-12" y1="10" x2="-12" y2="25" stroke="#d4a574" stroke-width="3"/>
    <line x1="12" y1="10" x2="12" y2="25" stroke="#d4a574" stroke-width="3"/>
  </g>
</svg>
